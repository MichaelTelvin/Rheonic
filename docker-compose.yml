name: rheonic

services:
  postgres:
    image: postgres:16-alpine
    container_name: rheonic_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rheonic_redis
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: rheonic_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    container_name: rheonic_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "rq worker --url \"$$REDIS_URL\" rheonic"

  scheduler:
    build: ./backend
    container_name: rheonic_scheduler
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV}
      AUTO_CLOSE_RUN_INTERVAL_SECONDS: ${AUTO_CLOSE_RUN_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.workers.scheduler_bootstrap
      && python -m app.workers.scheduler"

  frontend:
    build: ./frontend
    container_name: rheonic_frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  db_init:
    build: ./backend
    container_name: rheonic_db_init
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.infrastructure.db.migrate && echo 'db_init complete'"
    restart: "no"

  sdk_node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./sdk-node:/app
    command: >
      sh -c "npm install --silent --no-fund --no-audit --loglevel=error >/dev/null 2>&1
      && npm run -s build >/dev/null 2>&1
      && node --test --test-reporter=spec dist/protectEngine.test.js"

  sdk_python:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./sdk-python:/app
    command: >
      sh -c "pip install -q -e '.[dev]' >/dev/null 2>&1
      && pytest -v"

  frontend_test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install --silent --no-fund --no-audit --loglevel=error >/dev/null 2>&1
      && npm run -s test
      && npm run -s build >/dev/null 2>&1
      && echo 'frontend_build PASSED'"

  provider_stub:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./tests/e2e:/app/tests/e2e
    command: >
      sh -c "python /app/tests/e2e/provider_stub.py"

volumes:
  postgres-data:
  redis-data:
