name: rheonic_local

x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-rheonic}

services:
  postgres:
    image: postgres:16-alpine
    container_name: rheonic-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rheonic-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    container_name: rheonic-backend
    environment:
      <<: *runtime-env
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    container_name: rheonic-worker
    environment:
      <<: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "rq worker --url \"$$REDIS_URL\" \"$${RQ_QUEUE_NAME:-rheonic}\""
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    container_name: rheonic-scheduler
    environment:
      <<: *runtime-env
      AUTO_CLOSE_RUN_INTERVAL_SECONDS: ${AUTO_CLOSE_RUN_INTERVAL_SECONDS:-60}
      RQ_SCHEDULER_INTERVAL_SECONDS: ${RQ_SCHEDULER_INTERVAL_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.workers.scheduler_bootstrap
      && python -m app.workers.scheduler"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rheonic-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

  db_init:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    container_name: rheonic-db-init
    environment:
      <<: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.infrastructure.db.migrate && echo 'db_init complete'"
    restart: "no"

  provider_stub:
    image: python:3.12-alpine
    container_name: rheonic-provider-stub
    working_dir: /app
    volumes:
      - ./tests/e2e:/app/tests/e2e
    command: >
      sh -c "python /app/tests/e2e/provider_stub.py"

volumes:
  postgres-data:
  redis-data:
