name: rheonic_test

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rheonic_test
      POSTGRES_USER: rheonic
      POSTGRES_PASSWORD: rheonic
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rheonic -d rheonic_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis_test:
    image: redis:7-alpine
    volumes:
      - redis-test-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend_test:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rheonic:rheonic@postgres_test:5432/rheonic_test
      REDIS_URL: redis://redis_test:6379/0
      APP_ENV: test
      JWT_SECRET: test-secret
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
      db_init_test:
        condition: service_completed_successfully
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 30

  db_init_test:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rheonic:rheonic@postgres_test:5432/rheonic_test
      REDIS_URL: redis://redis_test:6379/0
      APP_ENV: test
      JWT_SECRET: test-secret
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    command: >
      sh -c "python -m app.infrastructure.db.migrate && echo 'db_init_test complete'"

  provider_stub_test:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./tests/e2e:/app/tests/e2e
    command: >
      sh -c "python /app/tests/e2e/provider_stub.py"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/count', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 20

  sdk_node_test:
    image: node:20-alpine
    working_dir: /app
    environment:
      RHEONIC_E2E_BACKEND_URL: http://backend_test:8000
      RHEONIC_E2E_PROVIDER_URL: http://provider_stub_test:8099
    volumes:
      - ./sdk-node:/app
    command: >
      sh -c "npm install --silent --no-fund --no-audit --loglevel=error >/dev/null 2>&1
      && npm run -s build >/dev/null 2>&1
      && node e2e/protect.e2e.mjs"
    depends_on:
      backend_test:
        condition: service_healthy
      provider_stub_test:
        condition: service_healthy

  sdk_python_test:
    image: python:3.12-alpine
    working_dir: /app
    environment:
      RHEONIC_E2E_BACKEND_URL: http://backend_test:8000
      RHEONIC_E2E_PROVIDER_URL: http://provider_stub_test:8099
    volumes:
      - ./sdk-python:/app
    command: >
      sh -c "pip install -q -e . >/dev/null 2>&1
      && python e2e/protect_e2e.py"
    depends_on:
      backend_test:
        condition: service_healthy
      provider_stub_test:
        condition: service_healthy

volumes:
  postgres-test-data:
  redis-test-data:
