[project]
name = "rheonic-backend"
version = "0.1.0"
description = "Backend service for Rheonic"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose>=3.3.0",
  "bcrypt>=4.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "rq-scheduler>=0.13.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
