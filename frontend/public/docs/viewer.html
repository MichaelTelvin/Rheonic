<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rheonic Docs</title>
    <style>
      :root {
        --bg: #0a0d14;
        --panel: #111827;
        --border: rgba(148, 163, 184, 0.28);
        --text: #e5e7eb;
        --muted: rgba(229, 231, 235, 0.78);
        --accent: rgba(167, 139, 250, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #11182a 0%, var(--bg) 58%);
        color: var(--text);
      }
      body:not(.viewer-ready) .wrap {
        visibility: hidden;
      }
      .wrap {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px 24px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tabs.hidden {
        display: none;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 132px;
        min-width: 132px;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 9px;
        padding: 8px 12px;
        background: rgba(148, 163, 184, 0.08);
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
        text-align: center;
      }
      .tab.active {
        background: var(--accent);
        border-color: rgba(167, 139, 250, 0.56);
        color: #f1eaff;
      }
      .link {
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        padding: 7px 12px;
        color: rgba(200, 210, 235, 0.9);
        text-decoration: none;
        background: rgba(148, 163, 184, 0.06);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.45);
        padding: 14px;
      }
      .canvas {
        background: #f4f6fb;
        border-radius: 8px;
        padding: 28px;
        min-height: 68vh;
      }
      .canvas.chart {
        padding: 8px;
        overflow: auto;
      }
      .doc {
        color: #1f2937;
        font-size: 16px;
        line-height: 1.6;
        max-width: 900px;
      }
      .doc.chart-doc {
        max-width: none;
      }
      .doc-loading {
        min-height: 52vh;
        display: flex;
        align-items: flex-start;
      }
      .doc-loading p {
        margin: 0;
        color: #475569;
      }
      .chart-image {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .canvas.chart.incident .chart-image {
        width: min(560px, 100%);
        max-width: min(560px, 100%);
        margin: 0 auto;
      }
      .canvas.chart.protect .chart-image {
        margin: 0 auto;
      }
      .doc h1,
      .doc h2,
      .doc h3 {
        color: #111827;
        line-height: 1.3;
        margin: 1.2em 0 0.6em;
      }
      .doc h1:first-child,
      .doc h2:first-child,
      .doc h3:first-child {
        margin-top: 0;
      }
      .doc p {
        margin: 0.55em 0;
      }
      .doc ul,
      .doc ol {
        margin: 0.55em 0 0.55em 1.2em;
      }
      .doc code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: rgba(15, 23, 42, 0.08);
        padding: 0.12em 0.32em;
        border-radius: 4px;
      }
      .doc pre {
        margin: 0.9em 0;
        padding: 12px;
        background: #e8eef9;
        border: 1px solid #c9d8f2;
        border-radius: 8px;
        overflow: auto;
      }
      .doc a {
        color: #2b4fae;
      }
      .muted {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="top">
        <div id="doc-tabs" class="tabs">
          <a id="tab-overview" class="tab" href="?doc=overview">Overview</a>
          <a id="tab-quickstart" class="tab" href="?doc=quickstart">Quickstart</a>
          <a id="tab-protect-mode" class="tab" href="?doc=protect-mode">Protect Mode</a>
          <a id="tab-incidents" class="tab" href="?doc=incidents">Incidents</a>
          <a id="tab-alerts" class="tab" href="?doc=alerts">Alerts</a>
          <a id="tab-roadmap" class="tab" href="?doc=roadmap">Roadmap</a>
          <a id="tab-api-reference" class="tab" href="?doc=api-reference">API Reference</a>
          <a id="tab-architecture" class="tab" href="?doc=architecture">Architecture</a>
        </div>
        <div id="chart-tabs" class="tabs">
          <a id="tab-chart-incident" class="tab" href="?chart=incident">Incident Flow</a>
          <a id="tab-chart-protect" class="tab" href="?chart=protect">Protect Flow</a>
        </div>
      </section>
      <section class="panel">
        <div class="canvas">
          <article id="doc" class="doc"></article>
        </div>
      </section>
    </main>
    <script>
      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function inlineMarkdown(text) {
        return text
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      }

      function renderMarkdown(md) {
        const lines = md.replace(/\r\n/g, "\n").split("\n");
        const out = [];
        let i = 0;
        let inCode = false;
        let codeLang = "";

        while (i < lines.length) {
          const line = lines[i];

          if (line.startsWith("```")) {
            if (!inCode) {
              inCode = true;
              codeLang = line.slice(3).trim();
              out.push('<pre><code' + (codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : "") + ">");
            } else {
              inCode = false;
              out.push("</code></pre>");
            }
            i += 1;
            continue;
          }

          if (inCode) {
            out.push(escapeHtml(line) + "\n");
            i += 1;
            continue;
          }

          if (!line.trim()) {
            i += 1;
            continue;
          }

          if (line.startsWith("### ")) {
            out.push("<h3>" + inlineMarkdown(escapeHtml(line.slice(4))) + "</h3>");
            i += 1;
            continue;
          }
          if (line.startsWith("## ")) {
            out.push("<h2>" + inlineMarkdown(escapeHtml(line.slice(3))) + "</h2>");
            i += 1;
            continue;
          }
          if (line.startsWith("# ")) {
            out.push("<h1>" + inlineMarkdown(escapeHtml(line.slice(2))) + "</h1>");
            i += 1;
            continue;
          }

          if (/^\d+\.\s+/.test(line)) {
            out.push("<ol>");
            while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
              out.push("<li>" + inlineMarkdown(escapeHtml(lines[i].replace(/^\d+\.\s+/, ""))) + "</li>");
              i += 1;
            }
            out.push("</ol>");
            continue;
          }

          if (/^-\s+/.test(line)) {
            out.push("<ul>");
            while (i < lines.length && /^-\s+/.test(lines[i])) {
              out.push("<li>" + inlineMarkdown(escapeHtml(lines[i].replace(/^-\s+/, ""))) + "</li>");
              i += 1;
            }
            out.push("</ul>");
            continue;
          }

          out.push("<p>" + inlineMarkdown(escapeHtml(line)) + "</p>");
          i += 1;
        }

        return out.join("");
      }

      (function () {
        const allowedDocs = new Set(["overview", "quickstart", "protect-mode", "incidents", "alerts", "roadmap", "api-reference", "architecture"]);
        const allowedCharts = new Set(["incident", "protect"]);
        const docCache = new Map();
        let initialRenderPending = true;
        const docTabs = document.getElementById("doc-tabs");
        const chartTabs = document.getElementById("chart-tabs");
        const target = document.getElementById("doc");
        const panel = target ? target.closest(".canvas") : null;
        if (!target || !panel) return;

        function parseRoute(search) {
          const params = new URLSearchParams(search);
          const requestedChart = params.get("chart");
          const requestedDoc = params.get("doc");
          const chart = allowedCharts.has(requestedChart) ? requestedChart : null;
          const doc = chart ? null : allowedDocs.has(requestedDoc) ? requestedDoc : "overview";
          return { chart, doc };
        }

        function setActiveTabs(route) {
          document.querySelectorAll(".tab.active").forEach((tab) => tab.classList.remove("active"));
          if (route.chart) {
            if (docTabs) docTabs.classList.add("hidden");
            if (chartTabs) chartTabs.classList.remove("hidden");
            const chartTab = document.getElementById("tab-chart-" + route.chart);
            if (chartTab) chartTab.classList.add("active");
          } else {
            if (docTabs) docTabs.classList.remove("hidden");
            if (chartTabs) chartTabs.classList.add("hidden");
            const docTab = document.getElementById("tab-" + route.doc);
            if (docTab) docTab.classList.add("active");
          }
        }

        async function renderRoute(route) {
          setActiveTabs(route);

          if (route.chart) {
            panel.className = "canvas chart " + route.chart;
            target.className = "doc chart-doc";
            const src = route.chart === "protect" ? "/docs/architecture/protect_decision_flow.svg" : "/docs/architecture/incident_flow.svg";
            const alt = route.chart === "protect" ? "Protect decision flow" : "Incident flow";
            await new Promise((resolve) => {
              const image = new Image();
              image.className = "chart-image";
              image.alt = alt;
              image.decoding = "async";
              image.onload = () => {
                target.innerHTML = "";
                target.appendChild(image);
                resolve();
              };
              image.onerror = () => {
                target.innerHTML = "<p class='muted'>Failed to load chart.</p>";
                resolve();
              };
              image.src = src;
            });
            if (initialRenderPending) {
              initialRenderPending = false;
              document.body.classList.add("viewer-ready");
            }
            return;
          }

          panel.className = "canvas";
          target.className = "doc";

          const cacheKey = route.doc;
          if (docCache.has(cacheKey)) {
            target.innerHTML = docCache.get(cacheKey);
            if (initialRenderPending) {
              initialRenderPending = false;
              document.body.classList.add("viewer-ready");
            }
            return;
          }

          try {
            const response = await fetch("./" + route.doc + ".md");
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            const markdown = await response.text();
            const rendered = renderMarkdown(markdown);
            docCache.set(cacheKey, rendered);
            target.innerHTML = rendered;
          } catch (error) {
            target.innerHTML = "<p class='muted'>Failed to load document.</p>";
          }
          if (initialRenderPending) {
            initialRenderPending = false;
            document.body.classList.add("viewer-ready");
          }
        }

        function warmViewerAssets() {
          allowedDocs.forEach((doc) => {
            if (docCache.has(doc)) {
              return;
            }
            fetch("./" + doc + ".md")
              .then((response) => (response.ok ? response.text() : Promise.reject(new Error("HTTP " + response.status))))
              .then((markdown) => {
                docCache.set(doc, renderMarkdown(markdown));
              })
              .catch(() => {});
          });
          ["/docs/architecture/incident_flow.svg", "/docs/architecture/protect_decision_flow.svg"].forEach((src) => {
            const image = new Image();
            image.decoding = "async";
            image.src = src;
          });
        }

        document.addEventListener("click", (event) => {
          const eventTarget = event.target;
          if (!(eventTarget instanceof Element)) {
            return;
          }
          const link = eventTarget.closest("a.tab");
          if (!link) return;
          const url = new URL(link.href, window.location.href);
          if (url.origin !== window.location.origin || url.pathname !== window.location.pathname) {
            return;
          }
          event.preventDefault();
          if (url.search === window.location.search) {
            return;
          }
          window.history.pushState({}, "", url);
          void renderRoute(parseRoute(url.search));
        });

        window.addEventListener("popstate", () => {
          void renderRoute(parseRoute(window.location.search));
        });

        void renderRoute(parseRoute(window.location.search));
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(warmViewerAssets);
        } else {
          window.setTimeout(warmViewerAssets, 150);
        }
      })();
    </script>
  </body>
</html>
