<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab");
        const chart = tab === "protect" ? "protect" : "incident";
        window.location.replace("/docs/viewer.html?chart=" + chart);
      })();
    </script>
  </body>
</html>
