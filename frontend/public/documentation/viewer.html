<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLMTokenBurnGuard Flow Charts</title>
    <style>
      :root {
        --bg: #0a0d14;
        --panel: #111827;
        --border: rgba(148, 163, 184, 0.28);
        --text: #e5e7eb;
        --muted: rgba(229, 231, 235, 0.78);
        --accent: rgba(167, 139, 250, 0.22);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #11182a 0%, var(--bg) 58%);
        color: var(--text);
      }
      .wrap {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px 24px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        gap: 8px;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 9px;
        padding: 8px 14px;
        background: rgba(148, 163, 184, 0.08);
        color: var(--muted);
        text-decoration: none;
      }
      .tab.active {
        background: var(--accent);
        border-color: rgba(167, 139, 250, 0.56);
        color: #f1eaff;
      }
      .link {
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        padding: 7px 12px;
        color: rgba(200, 210, 235, 0.9);
        text-decoration: none;
        background: rgba(148, 163, 184, 0.06);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.45);
        padding: 14px;
      }
      .canvas {
        background: #f4f6fb;
        border-radius: 8px;
        padding: 8px;
        overflow: auto;
      }
      .canvas img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .canvas.incident img {
        width: min(820px, calc(100% - 40px));
        margin: 0 auto;
      }
      .canvas.protect img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="top">
        <div class="tabs">
          <a id="tab-incident" class="tab" href="?tab=incident">Incident flow</a>
          <a id="tab-protect" class="tab" href="?tab=protect">Protect decision flow</a>
        </div>
      </section>
      <section class="panel">
        <div id="canvas" class="canvas">
          <img id="chart" src="./incident_flow.svg" alt="Flow chart" />
        </div>
      </section>
    </main>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab") === "protect" ? "protect" : "incident";
        const incident = document.getElementById("tab-incident");
        const protect = document.getElementById("tab-protect");
        const chart = document.getElementById("chart");
        const canvas = document.getElementById("canvas");
        if (!incident || !protect || !chart || !canvas) return;

        const src = tab === "protect" ? "./protect_decision_flow.svg" : "./incident_flow.svg";
        chart.src = src;
        chart.alt = tab === "protect" ? "Protect decision flow" : "Incident flow";
        incident.classList.toggle("active", tab === "incident");
        protect.classList.toggle("active", tab === "protect");
        canvas.classList.toggle("incident", tab === "incident");
        canvas.classList.toggle("protect", tab === "protect");
      })();
    </script>
  </body>
</html>
