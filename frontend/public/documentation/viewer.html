<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab");
        const chart = params.get("chart");
        const doc = params.get("doc");
        if (chart === "incident" || chart === "protect") {
          window.location.replace("/docs/viewer.html?chart=" + chart);
          return;
        }
        if (tab === "incident" || tab === "protect") {
          window.location.replace("/docs/viewer.html?chart=" + tab);
          return;
        }
        if (doc) {
          window.location.replace("/docs/viewer.html?doc=" + encodeURIComponent(doc));
          return;
        }
        window.location.replace("/docs/viewer.html?doc=scope");
      })();
    </script>
  </body>
</html>
