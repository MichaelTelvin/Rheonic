[project]
name = "rheonic"
version = "0.1.0"
description = "Python SDK for Rheonic"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typing-extensions>=4.8.0",
  "tiktoken>=0.7.0",
  "anthropic>=0.34.0",
  "google-generativeai>=0.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
