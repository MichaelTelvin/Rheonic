[project]
name = "rheonic-sdk"
version = "0.1.0b1"
description = "Python SDK for Rheonic observability and protect preflight enforcement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  {name = "Michael Telvin", email = "founder@rheonic.dev"}
]
maintainers = [
  {name = "Michael Telvin", email = "founder@rheonic.dev"}
]
keywords = ["llm", "ai", "observability", "guardrails", "openai", "anthropic", "google"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "httpx>=0.27.0",
  "typing-extensions>=4.8.0",
  "tiktoken>=0.7.0"
]

[project.optional-dependencies]
openai = [
  "openai>=4.0.0"
]
anthropic = [
  "anthropic>=0.34.0"
]
google = [
  "google-generativeai>=0.8.0"
]
providers = [
  "openai>=4.0.0",
  "anthropic>=0.34.0",
  "google-generativeai>=0.8.0"
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://beta.rheonic.dev"
Support = "mailto:support@rheonic.dev"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"rheonic" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rheonic*"]
