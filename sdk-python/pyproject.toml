[project]
name = "rheonic"
version = "0.1.0"
description = "Python SDK for Rheonic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  {name = "Rheonic", email = "founder@rheonic.dev"}
]
keywords = ["llm", "ai", "observability", "guardrails", "openai", "anthropic", "google"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "httpx>=0.27.0",
  "typing-extensions>=4.8.0",
  "tiktoken>=0.7.0"
]

[project.optional-dependencies]
openai = [
  "openai>=4.0.0"
]
anthropic = [
  "anthropic>=0.34.0"
]
google = [
  "google-generativeai>=0.8.0"
]
providers = [
  "openai>=4.0.0",
  "anthropic>=0.34.0",
  "google-generativeai>=0.8.0"
]
dev = [
  "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://rheonic.dev"
Repository = "https://github.com/rheonic/rheonic"
Issues = "https://github.com/rheonic/rheonic/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"rheonic" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rheonic*"]
