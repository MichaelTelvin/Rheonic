[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",
  ".venv",
  "dist",
  "node_modules",
  "frontend/dist",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "(^frontend/|^sdk-node/|^dist/|^node_modules/|^backend/app/tests/|^backend/alembic/|^sdk-python/tests/|^sdk-python/e2e/|^tests/e2e/)"
files = ["backend/app", "sdk-python/src/rheonic"]
mypy_path = ["backend", "sdk-python/src"]

[[tool.mypy.overrides]]
module = [
  "jose",
  "jose.*",
  "rq",
  "rq.*",
  "rq_scheduler",
  "rq_scheduler.*",
  "redis",
  "redis.*",
  "tiktoken",
  "google.generativeai",
]
ignore_missing_imports = true
