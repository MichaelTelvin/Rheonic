name: rheonic_staging

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV}
  APP_VERSION: ${APP_VERSION}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM_ALERTS: ${EMAIL_FROM_ALERTS:-}
  EMAIL_FROM_SYSTEM: ${EMAIL_FROM_SYSTEM:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  FEEDBACK_REPORT_EMAIL: ${FEEDBACK_REPORT_EMAIL:-}
  PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-rheonic}
  INCIDENT_DEDUP_WINDOW_SECONDS: ${INCIDENT_DEDUP_WINDOW_SECONDS:-}
  RETRY_STORM_WINDOW_SECONDS: ${RETRY_STORM_WINDOW_SECONDS:-}
  RETRY_STORM_COUNT: ${RETRY_STORM_COUNT:-}
  LOOP_WINDOW_SECONDS: ${LOOP_WINDOW_SECONDS:-}
  LOOP_COUNT: ${LOOP_COUNT:-}
  LOOP_MAX_GAP_SECONDS: ${LOOP_MAX_GAP_SECONDS:-}
  LOOP_CONCURRENCY_THRESHOLD: ${LOOP_CONCURRENCY_THRESHOLD:-}
  TOKEN_EXPLOSION_RATIO: ${TOKEN_EXPLOSION_RATIO:-}
  TOKEN_EXPLOSION_ABS: ${TOKEN_EXPLOSION_ABS:-}
  TOKEN_EXPLOSION_GROWTH_RATIO: ${TOKEN_EXPLOSION_GROWTH_RATIO:-}
  TOKEN_EXPLOSION_GROWTH_COUNT: ${TOKEN_EXPLOSION_GROWTH_COUNT:-}
  TOKEN_EXPLOSION_GROWTH_MIN_TOKENS: ${TOKEN_EXPLOSION_GROWTH_MIN_TOKENS:-}
  TOKEN_EXPLOSION_CONCURRENCY_THRESHOLD: ${TOKEN_EXPLOSION_CONCURRENCY_THRESHOLD:-}
  PROTECT_DECISION_TIMEOUT_MS: ${PROTECT_DECISION_TIMEOUT_MS:-}

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "log_checkpoints=off"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "56379:6379"
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --loglevel warning --requirepass \"$REDIS_PASSWORD\"; else exec redis-server --appendonly yes --loglevel warning; fi",
      ]
    volumes:
      - redis-staging-data:/data
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  db_init:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    environment:
      <<: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    command: >
      sh -c "python -m app.infrastructure.db.migrate && echo 'db_init complete'"
    logging: *default-logging
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    environment:
      <<: *runtime-env
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    networks:
      app:
      edge:
        aliases:
          - staging-backend
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips \"$${FORWARDED_ALLOW_IPS:-*}\""
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    environment:
      <<: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    networks:
      - app
    command: >
      sh -c "python -m app.infrastructure.workers.worker"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; sys.exit(0 if any('app.infrastructure.workers.worker' in p.read_text(errors='ignore').replace(chr(0), ' ') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\"",
        ]
      interval: 15s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    environment:
      <<: *runtime-env
      AUTO_CLOSE_RUN_INTERVAL_SECONDS: ${AUTO_CLOSE_RUN_INTERVAL_SECONDS:-60}
      RQ_SCHEDULER_INTERVAL_SECONDS: ${RQ_SCHEDULER_INTERVAL_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    networks:
      - app
    command: >
      sh -c "python -m app.workers.scheduler_bootstrap && python -m app.workers.scheduler"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; sys.exit(0 if any('python-mapp.workers.scheduler' in p.read_text(errors='ignore').replace(chr(0), '') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\"",
        ]
      interval: 15s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PUBLIC_CONTACT_EMAIL: ${VITE_PUBLIC_CONTACT_EMAIL:-support@example.com}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
      edge:
        aliases:
          - staging-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-staging-data:
    name: rheonic_staging_postgres-staging-data
  redis-staging-data:
    name: rheonic_staging_redis_data

networks:
  app:
    name: rheonic_staging_app
  edge:
    external: true
    name: rheonic_staging_edge
